version: "3.3"
services: 
    # tpr-esteettomyyssovellus
    tpr-esteettomyyssovellus:
        hostname: tpr-esteettomyyssovellus
        build:
            context: .
            dockerfile: Dockerfile
        command: bash -c "./run_web.sh"
        env_file:
            - ./local_dev/.env
        ports:
            - 8000:8000
        volumes:
            - ./accessibility:/app
            - ./local_dev/run_web.sh:/app/run_web.sh
        networks:
            - default
    # tpr-reverse-proxy
    tpr-reverse-proxy:
        hostname: tpr-reverse-proxy
        build:
            context: ./nginx
            dockerfile: Dockerfile.nginx
        environment:
            - HOSTIP=$HOSTIP
        depends_on:
            - tpr-esteettomyyssovellus
        ports:
            - 80:80
        networks:
            - default

    
    tpr-esteettomyys-db:
        hostname: tpr-esteettomyys-db
        build:
            context: ./local_dev
            dockerfile: Dockerfile.database
        environment: 
            - POSTGRES_PASSWORD=plop123
            - PGDATA=/pgdata
        ports:
            - 5432:5432
        volumes:
            - ./pgdata:/pgdata
        networks:
            - default
